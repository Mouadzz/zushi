name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: macos-latest
            target: aarch64-apple-darwin
            label: apple-silicon
          - runner: macos-latest
            target: x86_64-apple-darwin
            label: intel

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build mod-tools
        run: |
          ARCH=${{ matrix.target == 'aarch64-apple-darwin' && 'arm64' || 'x86_64' }}
          cmake -S mod-tools -B mod-tools/build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=$ARCH
          cmake --build mod-tools/build -j$(sysctl -n hw.ncpu)
          mkdir -p src-tauri/binaries
          cp mod-tools/build/mod-tools src-tauri/binaries/mod-tools-${{ matrix.target }}
          chmod +x src-tauri/binaries/mod-tools-${{ matrix.target }}

      - name: Install dependencies
        run: npm ci

      - name: Check updater key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if grep -q REPLACE_WITH_TAURI_UPDATER_PUBLIC_KEY src-tauri/tauri.conf.json || [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::Set plugins.updater.pubkey in src-tauri/tauri.conf.json and the TAURI_SIGNING_PRIVATE_KEY secret (npx tauri signer generate)."
            exit 1
          fi

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: npx tauri
          args: --target ${{ matrix.target }}

      # Both targets produce Zushi.app.tar.gz, so give the updater bundle an arch-specific name.
      - name: Collect artifacts
        run: |
          VERSION=$(jq -r .version src-tauri/tauri.conf.json)
          ARCH=${{ matrix.target == 'aarch64-apple-darwin' && 'aarch64' || 'x64' }}
          BUNDLE=src-tauri/target/${{ matrix.target }}/release/bundle
          mkdir -p out
          cp $BUNDLE/dmg/*.dmg out/
          cp $BUNDLE/macos/Zushi.app.tar.gz out/Zushi_${VERSION}_${ARCH}.app.tar.gz
          cp $BUNDLE/macos/Zushi.app.tar.gz.sig out/Zushi_${VERSION}_${ARCH}.app.tar.gz.sig

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zushi-${{ matrix.label }}
          path: out/*

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Get version
        id: version
        run: echo "version=$(jq -r .version src-tauri/tauri.conf.json)" >> "$GITHUB_OUTPUT"

      - name: Tag
        id: tag
        run: echo "tag=v${{ steps.version.outputs.version }}-${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      # The app reads releases/latest/download/latest.json to find, verify and install updates.
      - name: Write update manifest
        run: |
          VERSION=${{ steps.version.outputs.version }}
          BASE=https://github.com/${{ github.repository }}/releases/download/${{ steps.tag.outputs.tag }}
          jq -n \
            --arg version "$VERSION" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg arm_url "$BASE/Zushi_${VERSION}_aarch64.app.tar.gz" \
            --arg arm_sig "$(cat artifacts/Zushi_${VERSION}_aarch64.app.tar.gz.sig)" \
            --arg x64_url "$BASE/Zushi_${VERSION}_x64.app.tar.gz" \
            --arg x64_sig "$(cat artifacts/Zushi_${VERSION}_x64.app.tar.gz.sig)" \
            '{version: $version, pub_date: $date, platforms: {
              "darwin-aarch64": {url: $arm_url, signature: $arm_sig},
              "darwin-x86_64": {url: $x64_url, signature: $x64_sig}
            }}' > artifacts/latest.json
          rm artifacts/*.sig
          cat artifacts/latest.json

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Zushi v${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
